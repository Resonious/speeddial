<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeedDial downloads</title>
<style>
:root { color-scheme:light dark; --bg:#fcf8f4; --fg:#29221e; --muted:#70655d; --card:#fff; --line:#dfd5cc; --ember:#b7451c; }
@media(prefers-color-scheme:dark) { :root { --bg:#191614; --fg:#f3e8df; --muted:#baa99d; --card:#231e1a; --line:#483a30; --ember:#ff9c62; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,sans-serif; max-width:760px; margin:48px auto; padding:0 20px; }
h1 { margin-bottom:0; } h2 { font-size:1.2rem; margin:0; }
p { margin:8px 0; } .muted,.meta { color:var(--muted); font-size:.9rem; }
#status { padding:16px; border:1px solid var(--line); border-radius:12px; margin:24px 0; }
#status[data-state=building] { border-color:var(--ember); box-shadow:inset 3px 0 var(--ember); }
#status[data-state=building] strong { color:var(--ember); }
article { background:var(--card); border:1px solid var(--line); padding:20px; margin:16px 0; border-radius:12px; }
a { display:inline-block; color:var(--ember); font-weight:600; overflow-wrap:anywhere; margin-top:8px; }
time { white-space:normal; } code { overflow-wrap:anywhere; }
</style>
<h1>SpeedDial downloads</h1>
<p class="muted">The latest available release artifacts.</p>
<div id="status" role="status"><strong>Checking build status…</strong><p class="muted" id="detail"></p></div>
<main id="artifacts"></main>
<script>
const notes = {
  'speeddial.apk': 'Open the APK on your Android phone. Allow installs from your browser when prompted.',
  'speeddial-wear.apk': 'Install on your Wear OS watch and pair with the SpeedDial phone app.',
  'speeddial-linux.tar.gz': 'Extract the archive and run bundle/speeddial_app. Requires GTK3.',
  'speeddial-daemon-linux-x64.tar.gz': 'Extract the archive and run bundle/bin/speeddial serve.'
};
const status = document.querySelector('#status');
const detail = document.querySelector('#detail');
const cards = new Map();
function sizeLabel(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  const units = ['KiB', 'MiB', 'GiB', 'TiB'];
  let value = bytes / 1024, unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return `${value.toFixed(2)} ${units[unit]} (${bytes.toLocaleString()} bytes)`;
}
async function refresh() {
  try {
    const response = await fetch('status.json', {cache:'no-store', signal:AbortSignal.timeout(5000)});
    if (!response.ok) throw new Error('Status unavailable');
    const data = await response.json();
    status.dataset.state = data.status;
    status.querySelector('strong').textContent = data.status === 'building' ? 'Building…' : data.status === 'failed' ? 'Build failed — previous downloads retained' : 'No build in progress';
    detail.textContent = data.status === 'building' ? `Started ${new Date(data.startedAt).toLocaleString()}` : data.error || (data.finishedAt ? `Finished ${new Date(data.finishedAt).toLocaleString()}` : 'Waiting for the first build.');
    for (const artifact of data.artifacts) {
      let card = cards.get(artifact.name);
      if (!card) {
        card = document.createElement('article');
        const heading = document.createElement('h2'); heading.textContent = artifact.label;
        const meta = document.createElement('p'); meta.className = 'meta';
        const note = document.createElement('p'); note.textContent = notes[artifact.name] || '';
        const link = document.createElement('a'); link.textContent = `Download ${artifact.name}`; link.download = artifact.name;
        card.append(heading, meta, note, link);
        cards.set(artifact.name, card); document.querySelector('main').append(card);
      }
      card.querySelector('.meta').textContent = artifact.size === null ? 'Not built yet' : `${sizeLabel(artifact.size)} · Built ${new Date(artifact.builtAt).toLocaleString()}`;
      const link = card.querySelector('a');
      link.hidden = artifact.size === null;
      if (artifact.size !== null) link.href = artifact.name;
    }
  } catch (error) {
    status.dataset.state = 'offline';
    status.querySelector('strong').textContent = 'Build server unreachable';
    detail.textContent = 'Build status could not be refreshed. Displayed artifact details may be out of date.';
  } finally { setTimeout(refresh, 2000); }
}
refresh();
</script>
</html>
